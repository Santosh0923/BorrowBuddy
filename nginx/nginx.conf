events {}

http {
    upstream borrowbuddy_backend {
        server backend1:8000 max_fails=1 fail_timeout=30s;
        server backend2:8000 max_fails=1 fail_timeout=30s;
        server backend3:8000 max_fails=1 fail_timeout=30s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://borrowbuddy_backend;

            proxy_connect_timeout 1s;

            proxy_next_upstream error timeout
                                http_500 http_502 http_503 http_504;

            proxy_next_upstream_tries 3;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}